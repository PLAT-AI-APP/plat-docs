# PR 마다 문서 규칙을 검사하고 문서 사이트(site/)가 빌드되는지 본다. main·develop 보호 규칙의 필수 상태 체크(check)다.
name: check

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: 스크립트 테스트
        run: node --test "scripts/*.test.mjs"
      - name: 문서 규칙 검사
        run: node scripts/build-bundle.mjs --check
      # 배포(Vercel · Firebase App Hosting)와 같은 빌드를 미리 돌려, 화면 코드가 깨진 PR 은 머지되지 않게 한다.
      - name: 사이트 의존성 설치
        working-directory: site
        run: npm ci
      - name: 사이트 타입 검사·빌드
        working-directory: site
        # typecheck 가 먼저 문서 묶음(src/generated, 커밋하지 않음)을 만든 뒤 타입을 검사하고, 이어서 같은 묶음으로 빌드한다.
        run: npm run typecheck && npx next build
